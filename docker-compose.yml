version: "3.8"

services:
  app:
    build:
      context: .
      target: runner
    image: eterna-backend:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TTL_SECONDS: 30
      DATA_REFRESH_CRON: "*/30 * * * * *"
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:?COINGECKO_API_KEY is required}
    ports:
      - "8081:8081"
    volumes:
      - ./config/.env.production:/app/config/.env.production:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
